<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دستیار هوشمند زیرنویس (استخراج و ترجمه)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --inner-bg: #0f172a;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .main-tabs {
            display: flex;
            background-color: #1a2333;
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            gap: 6px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .main-tab-btn {
            flex: 1;
            padding: 10px 6px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .main-tab-btn.active {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 16px;
        }

        .tab-content.active {
            display: flex;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="password"],
        input[type="url"],
        select {
            width: 100%;
            padding: 12px;
            background-color: var(--inner-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .ltr-input {
            direction: ltr;
            text-align: left;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-primary:disabled { background-color: var(--border-color); cursor: not-allowed; }

        .btn-green { background-color: var(--accent-green); color: white; }
        .btn-green:hover { background-color: var(--accent-green-hover); }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-outline:hover { background-color: var(--inner-bg); }

        .custom-file-upload {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: block;
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 13px;
        }
        .custom-file-upload:hover { border-color: var(--primary); color: var(--text-main); }

        .items-list {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .list-item {
            background-color: var(--inner-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .list-item-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            word-break: break-all;
        }

        .list-item-title { font-weight: bold; color: var(--text-main); }
        .list-item-sub { color: var(--text-muted); font-size: 11px; }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
        }

        .progress-bar-wrapper {
            background-color: var(--inner-bg);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            background-color: var(--primary);
            height: 100%;
            width: 0%;
            transition: width 0.2s;
        }

        .status-msg {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
        }
        .status-msg.success { color: var(--accent-green); }
        .status-msg.error { color: var(--danger); }

        #output {
            background-color: var(--inner-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
            display: none;
            margin-top: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- منوی اصلی -->
        <div class="main-tabs">
            <button class="main-tab-btn active" onclick="switchMainTab('extract')">🎙️ استخراج صوت</button>
            <button class="main-tab-btn" onclick="switchMainTab('translate')">🌐 ترجمه زیرنویس</button>
            <button class="main-tab-btn" onclick="switchMainTab('settings')">⚙️ تنظیمات</button>
        </div>

        <div class="tab-content-wrapper">
            <!-- ==================== تب ۱: استخراج صوت ==================== -->
            <div id="tab-extract" class="tab-content active">
                <div class="card">
                    <div class="form-group">
                        <label>🔑 انتخاب کلید API برای Whisper</label>
                        <select id="activeKeySelect">
                            <option value="">-- ابتدا کلید API انتخاب کنید --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="audioFileInput" class="custom-file-upload" id="audioFileLabel">
                            📁 جهت انتخاب فایل صوتی اینجا کلیک کنید
                        </label>
                        <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">
                    </div>

                    <button class="btn btn-primary" id="startExtractBtn" onclick="processAudio()">🚀 استخراج و ساخت SRT</button>

                    <div id="progressBox" style="display: none; margin-top: 16px;">
                        <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted);">
                            <span id="progressState">در حال پردازش...</span>
                            <span id="progressPercent">0%</span>
                        </div>
                        <div class="progress-bar-wrapper">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                    </div>

                    <button class="btn btn-green" id="downloadBtn" style="display: none; margin-top: 12px;" onclick="downloadSRT()">📥 دانلود فایل زیرنویس (SRT)</button>
                    <div id="output"></div>
                </div>
            </div>

            <!-- ==================== تب ۲: ترجمه زیرنویس ==================== -->
            <div id="tab-translate" class="tab-content">
                <div class="card">
                    <div class="card-title">🌐 ترجمه هوشمند زیرنویس</div>
                    
                    <form id="translateForm">
                        <div class="form-group">
                            <label>موتور پردازش ترجمه:</label>
                            <select id="transEngine" onchange="toggleEngineOptions()">
                                <option value="google">گوگل ترنسلیت (رایگان و سریع)</option>
                                <option value="ai">هوش مصنوعی (Groq / OpenAI - با کیفیت فوق‌العاده)</option>
                            </select>
                        </div>

                        <div id="aiEngineOptions" class="form-group" style="display: none;">
                            <label>🔑 انتخاب کلید API برای هوش مصنوعی:</label>
                            <select id="aiKeySelect">
                                <option value="">-- کلید مورد نظر را انتخاب کنید --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="srtFileInput" class="custom-file-upload" id="srtFileLabel">
                                📄 انتخاب فایل زیرنویس (SRT)
                            </label>
                            <input type="file" id="srtFileInput" accept=".srt" style="display: none;" required>
                        </div>

                        <div class="form-group">
                            <label>ترجمه به زبان مقصد:</label>
                            <select id="langTo">
                                <option value="fa">فارسی (Persian)</option>
                                <option value="en">انگلیسی (English)</option>
                                <option value="ar">عربی (Arabic)</option>
                                <option value="tr">ترکی (Turkish)</option>
                                <option value="de">آلمانی (German)</option>
                                <option value="fr">فرانسوی (French)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary" id="btnTranslateSubmit">🚀 شروع عملیات ترجمه</button>
                    </form>

                    <button type="button" id="btnTransDownload" class="btn btn-green" style="display: none; margin-top: 12px;">📥 دانلود زیرنویس ترجمه شده</button>
                    <div id="transStatus" class="status-msg"></div>
                </div>
            </div>

            <!-- ==================== تب ۳: تنظیمات ==================== -->
            <div id="tab-settings" class="tab-content">
                <div class="card">
                    <div class="card-title">🔑 مدیریت کلیدهای API</div>
                    <div class="form-group">
                        <label>انتخاب پرووایدر</label>
                        <select id="keyProviderSelect"></select>
                    </div>
                    <div class="form-row">
                        <div style="flex: 1;">
                            <input type="text" id="keyLabelInput" placeholder="نام/لیبل کلید">
                        </div>
                        <div style="flex: 1.5;">
                            <input type="password" id="keyValueInput" class="ltr-input" placeholder="sk-... یا gsk_...">
                        </div>
                    </div>
                    <button class="btn btn-green" onclick="saveApiKey()">➕ ذخیره کلید API</button>
                    <div class="items-list" id="keysListContainer"></div>
                </div>

                <div class="card">
                    <div class="card-title">⚙️ افزودن/ویرایش پرووایدر</div>
                    <div class="form-row">
                        <div style="flex: 1;">
                            <input type="text" id="providerIdInput" class="ltr-input" placeholder="شناسه (مثلاً: groq)">
                        </div>
                        <div style="flex: 1.5;">
                            <input type="text" id="providerNameInput" placeholder="نام نمایشی (مثلاً: Groq AI)">
                        </div>
                    </div>
                    <div class="form-group">
                        <input type="url" id="providerEndpointInput" class="ltr-input" placeholder="آدرس API (Endpoint)">
                    </div>
                    <div class="form-group">
                        <input type="text" id="providerModelsInput" class="ltr-input" placeholder="مدل‌ها (مثلاً: llama-3.3-70b-versatile, whisper-large-v3-turbo)">
                    </div>
                    <button class="btn btn-primary" onclick="saveProvider()">💾 ذخیره پرووایدر</button>
                    <div class="items-list" id="providersListContainer"></div>
                </div>

                <div class="card">
                    <div class="card-title">📦 پشتیبان‌گیری</div>
                    <div class="form-row" style="margin-bottom: 0;">
                        <button class="btn btn-outline" onclick="exportData()">📥 دانلود بکاپ</button>
                        <button class="btn btn-outline" onclick="document.getElementById('importFileInput').click()">📤 بازیابی بکاپ</button>
                        <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importData(event)">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data State
        let providers = JSON.parse(localStorage.getItem('app_providers') || '[]');
        let apiKeys = JSON.parse(localStorage.getItem('app_api_keys') || '[]');
        
        let selectedAudioFile = null;
        let selectedSrtFile = null;
        let generatedSrt = '';
        let outputFileName = 'subtitle';
        let translateDownloadUrl = null;

        // مقداردهی اولیه پیش‌فرض در صورت نبود تنظیمات
        if (providers.length === 0) {
            providers = [{
                id: 'groq',
                name: 'Groq AI',
                endpoint: 'https://api.groq.com/openai/v1/chat/completions',
                transcribeEndpoint: 'https://api.groq.com/openai/v1/audio/transcriptions',
                models: ['llama-3.3-70b-versatile', 'whisper-large-v3-turbo']
            }];
            localStorage.setItem('app_providers', JSON.stringify(providers));
        }

        // تغییر تب‌ها
        function switchMainTab(tab) {
            document.querySelectorAll('.main-tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            const tabs = ['extract', 'translate', 'settings'];
            const activeIdx = tabs.indexOf(tab);
            if (activeIdx !== -1) {
                document.querySelectorAll('.main-tab-btn')[activeIdx].classList.add('active');
                document.getElementById(`tab-${tab}`).classList.add('active');
            }
        }

        function toggleEngineOptions() {
            const engine = document.getElementById('transEngine').value;
            document.getElementById('aiEngineOptions').style.display = (engine === 'ai') ? 'block' : 'none';
        }

        // رندر تنظیمات
        function renderAll() {
            const activeKeySelect = document.getElementById('activeKeySelect');
            const aiKeySelect = document.getElementById('aiKeySelect');
            
            activeKeySelect.innerHTML = '<option value="">-- کلید مورد نظر را انتخاب کنید --</option>';
            aiKeySelect.innerHTML = '<option value="">-- کلید مورد نظر را انتخاب کنید --</option>';

            apiKeys.forEach((item, index) => {
                const prov = providers.find(p => p.id === item.providerId);
                const provName = prov ? prov.name : item.providerId;
                const optionText = `${item.label} (${provName})`;
                
                activeKeySelect.innerHTML += `<option value="${index}">${optionText}</option>`;
                aiKeySelect.innerHTML += `<option value="${index}">${optionText}</option>`;
            });

            const keyProviderSelect = document.getElementById('keyProviderSelect');
            keyProviderSelect.innerHTML = '';
            providers.forEach(p => {
                keyProviderSelect.innerHTML += `<option value="${p.id}">${p.name} (${p.id})</option>`;
            });

            const keysListContainer = document.getElementById('keysListContainer');
            keysListContainer.innerHTML = apiKeys.length === 0 ? '<div style="color:var(--text-muted); font-size:12px; text-align:center;">هیچ کلیدی ثبت نشده است.</div>' : '';
            apiKeys.forEach((item, index) => {
                const prov = providers.find(p => p.id === item.providerId);
                keysListContainer.innerHTML += `
                    <div class="list-item">
                        <div class="list-item-info">
                            <span class="list-item-title">${item.label} (${prov ? prov.name : item.providerId})</span>
                            <span class="list-item-sub">${item.key.substring(0, 8)}...</span>
                        </div>
                        <button class="delete-btn" onclick="deleteApiKey(${index})">🗑️</button>
                    </div>
                `;
            });

            const providersListContainer = document.getElementById('providersListContainer');
            providersListContainer.innerHTML = providers.length === 0 ? '<div style="color:var(--text-muted); font-size:12px; text-align:center;">هیچ پرووایدر ثبت نشده است.</div>' : '';
            providers.forEach((p, index) => {
                providersListContainer.innerHTML += `
                    <div class="list-item">
                        <div class="list-item-info">
                            <span class="list-item-title">${p.name} (${p.id})</span>
                            <span class="list-item-sub">${p.models.join(', ')}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteProvider(${index})">🗑️</button>
                    </div>
                `;
            });
        }

        // ذخیره کلید
        function saveApiKey() {
            const providerId = document.getElementById('keyProviderSelect').value;
            const label = document.getElementById('keyLabelInput').value.trim();
            const key = document.getElementById('keyValueInput').value.trim();

            if (!label || !key) return alert('لطفاً تمامی فیلدهای کلید را پر کنید.');

            apiKeys.push({ providerId, label, key });
            localStorage.setItem('app_api_keys', JSON.stringify(apiKeys));
            document.getElementById('keyLabelInput').value = '';
            document.getElementById('keyValueInput').value = '';
            renderAll();
        }

        function deleteApiKey(index) {
            apiKeys.splice(index, 1);
            localStorage.setItem('app_api_keys', JSON.stringify(apiKeys));
            renderAll();
        }

        function saveProvider() {
            const id = document.getElementById('providerIdInput').value.trim();
            const name = document.getElementById('providerNameInput').value.trim();
            const endpoint = document.getElementById('providerEndpointInput').value.trim();
            const modelsRaw = document.getElementById('providerModelsInput').value.trim();

            if (!id || !name || !endpoint) return alert('مشخصات پرووایدر کامل نیست.');

            const models = modelsRaw ? modelsRaw.split(',').map(m => m.trim()) : ['default'];
            const existingIndex = providers.findIndex(p => p.id === id);

            const providerObj = {
                id,
                name,
                endpoint,
                transcribeEndpoint: 'https://api.groq.com/openai/v1/audio/transcriptions',
                models
            };

            if (existingIndex >= 0) {
                providers[existingIndex] = providerObj;
            } else {
                providers.push(providerObj);
            }

            localStorage.setItem('app_providers', JSON.stringify(providers));
            document.getElementById('providerIdInput').value = '';
            document.getElementById('providerNameInput').value = '';
            document.getElementById('providerEndpointInput').value = '';
            document.getElementById('providerModelsInput').value = '';
            renderAll();
        }

        function deleteProvider(index) {
            providers.splice(index, 1);
            localStorage.setItem('app_providers', JSON.stringify(providers));
            renderAll();
        }

        function exportData() {
            const data = { providers, apiKeys };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'ai_sub_backup.json';
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsed = JSON.parse(evt.target.result);
                    if (parsed.providers) providers = parsed.providers;
                    if (parsed.apiKeys) apiKeys = parsed.apiKeys;
                    localStorage.setItem('app_providers', JSON.stringify(providers));
                    localStorage.setItem('app_api_keys', JSON.stringify(apiKeys));
                    renderAll();
                    alert('اطلاعات با موفقیت بازیابی شد.');
                } catch(err) {
                    alert('فایل فایل بکاپ معتبر نیست.');
                }
            }
            reader.readAsText(file);
        }

        // ==================== مدیریت انتخاب فایل صوتی ====================
        document.getElementById('audioFileInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                selectedAudioFile = e.target.files[0];
                document.getElementById('audioFileLabel').textContent = '📄 فایل صوتی: ' + selectedAudioFile.name;
                document.getElementById('audioFileLabel').style.borderColor = 'var(--accent-green)';
                
                const lastDot = selectedAudioFile.name.lastIndexOf('.');
                outputFileName = lastDot !== -1 ? selectedAudioFile.name.substring(0, lastDot) : selectedAudioFile.name;
            }
        });

        function formatSRTTime(seconds) {
            const date = new Date(seconds * 1000);
            const hh = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mm = String(date.getUTCMinutes()).padStart(2, '0');
            const ss = String(date.getUTCSeconds()).padStart(2, '0');
            const ms = String(date.getUTCMilliseconds()).padStart(3, '0');
            return `${hh}:${mm}:${ss},${ms}`;
        }

        function convertToSRT(segments) {
            let srtText = "";
            segments.forEach((seg, i) => {
                srtText += `${i + 1}\n${formatSRTTime(seg.start)} --> ${formatSRTTime(seg.end)}\n${seg.text.trim()}\n\n`;
            });
            return srtText;
        }

        async function processAudio() {
            const keyIndex = document.getElementById('activeKeySelect').value;
            if (keyIndex === "") return alert('لطفاً ابتدا یک کلید API انتخاب کنید.');
            if (!selectedAudioFile) return alert('لطفاً یک فایل صوتی انتخاب کنید.');

            const keyObj = apiKeys[keyIndex];
            const providerObj = providers.find(p => p.id === keyObj.providerId);

            const formData = new FormData();
            formData.append('file', selectedAudioFile);
            formData.append('model', 'whisper-large-v3-turbo');
            formData.append('response_format', 'verbose_json');

            document.getElementById('progressBox').style.display = 'block';

            const xhr = new XMLHttpRequest();
            const endpoint = (providerObj && providerObj.transcribeEndpoint) ? providerObj.transcribeEndpoint : 'https://api.groq.com/openai/v1/audio/transcriptions';
            
            xhr.open('POST', endpoint);
            xhr.setRequestHeader('Authorization', `Bearer ${keyObj.key}`);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    document.getElementById('progressBar').style.width = pct + '%';
                    document.getElementById('progressPercent').innerText = pct + '%';
                    document.getElementById('progressState').innerText = pct < 100 ? 'در حال ارسال فایل...' : 'در حال هوش مصنوعی...';
                }
            };

            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data.segments) {
                            generatedSrt = convertToSRT(data.segments);
                            document.getElementById('output').style.display = 'block';
                            document.getElementById('output').innerText = generatedSrt;
                            document.getElementById('downloadBtn').style.display = 'block';
                            document.getElementById('progressState').innerText = 'عملیات با موفقیت انجام شد! 🎉';
                        } else {
                            alert('پاسخ شامل زمان‌بندی SRT نیست.');
                        }
                    } catch(e) {
                        alert('خطا در پردازش پاسخ سرور.');
                    }
                } else {
                    alert('خطا از API: ' + xhr.responseText);
                }
            };

            xhr.onerror = function() {
                alert('خطای شبکه. اتصال اینترنت خود را بررسی کنید.');
            };

            xhr.send(formData);
        }

        function downloadSRT() {
            if (!generatedSrt) return;
            const blob = new Blob([generatedSrt], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `${outputFileName}.srt`;
            a.click();
        }

        // ==================== مدیریت انتخاب فایل SRT ترجمه ====================
        document.getElementById('srtFileInput').addEventListener('change', function(e) {
            if (e.target.files && e.target.files[0]) {
                selectedSrtFile = e.target.files[0];
                document.getElementById('srtFileLabel').textContent = '📄 فایل زیرنویس: ' + selectedSrtFile.name;
                document.getElementById('srtFileLabel').style.borderColor = 'var(--accent-green)';
            }
        });

        document.getElementById('translateForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!selectedSrtFile) return alert('لطفاً یک فایل زیرنویس (SRT) انتخاب کنید.');

            const engine = document.getElementById('transEngine').value;
            const langTo = document.getElementById('langTo').value;
            const formData = new FormData();
            formData.append('file', selectedSrtFile);
            formData.append('to', langTo);

            let url = '/translate-srt';

            if (engine === 'ai') {
                const keyIdx = document.getElementById('aiKeySelect').value;
                if (keyIdx === "") return alert('لطفاً یک کلید API برای هوش مصنوعی انتخاب کنید.');
                
                const keyObj = apiKeys[keyIdx];
                const provObj = providers.find(p => p.id === keyObj.providerId);

                url = '/translate-ai-srt';
                formData.append('api_key', keyObj.key);
                formData.append('endpoint_url', provObj ? provObj.endpoint : 'https://api.groq.com/openai/v1/chat/completions');
                formData.append('model', provObj ? provObj.models[0] : 'llama-3.3-70b-versatile');
            }

            const btnSubmit = document.getElementById('btnTranslateSubmit');
            const transStatus = document.getElementById('transStatus');
            const btnDownload = document.getElementById('btnTransDownload');

            btnSubmit.disabled = true;
            btnDownload.style.display = 'none';
            transStatus.className = 'status-msg';
            transStatus.innerText = 'در حال ترجمه فایل زیرنویس... لطفاً شکیبا باشید.';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.details || errData.error || 'خطا در انجام ترجمه');
                }

                const blob = await response.blob();
                translateDownloadUrl = URL.createObjectURL(blob);

                transStatus.className = 'status-msg success';
                transStatus.innerText = 'ترجمه با موفقیت تکمیل شد! 🎉';
                btnDownload.style.display = 'block';

            } catch (err) {
                transStatus.className = 'status-msg error';
                transStatus.innerText = 'خطا: ' + err.message;
            } finally {
                btnSubmit.disabled = false;
            }
        });

        document.getElementById('btnTransDownload').addEventListener('click', function() {
            if (!translateDownloadUrl) return;
            const a = document.createElement('a');
            a.href = translateDownloadUrl;
            a.download = `translated_${selectedSrtFile ? selectedSrtFile.name : 'sub.srt'}`;
            a.click();
        });

        renderAll();
    </script>
</body>
</html>
